<meta charset="utf-8">
<title>Слово как вещь в поле</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;1,300&family=PT+Serif:ital,wght@0,400;1,400&display=swap">

<style>
  :root{ --paper:#e6e4df; --ink:#191714; --half:#6f6a63; --hair:#c9c5bd;
         --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
         --serif:"PT Serif",Georgia,serif; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); overflow:hidden;
       font-family:var(--serif); -webkit-font-smoothing:antialiased}
  canvas{position:fixed; inset:0; display:block; width:100%; height:100%}
  #trace{z-index:1}
  /* у сказанного своё время: этот слой гаснет вдесятеро медленнее, чем след движения */
  #words{z-index:2; pointer-events:none; mix-blend-mode:multiply}

  /* строка-субтитр: живёт только в режиме 1, для сравнения */
  #line{position:fixed; left:50%; bottom:16vh; transform:translateX(-50%); z-index:4;
        width:min(46ch,86vw); text-align:center; opacity:0; white-space:pre-wrap;
        pointer-events:none; text-wrap:balance}
  #line.mark{font-family:var(--mono); font-weight:300; font-size:clamp(.9rem,1.7vw,1.15rem);
             letter-spacing:.06em; color:var(--half); line-height:2.1}
  #line.say{font-family:var(--serif); font-size:clamp(1.15rem,2.5vw,1.75rem);
            letter-spacing:.005em; color:var(--ink); line-height:1.85}

  #panel{position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex;
         align-items:center; justify-content:center; gap:1.4rem; flex-wrap:wrap;
         padding:.9rem 1.2rem; font-family:var(--mono); font-size:.72rem;
         letter-spacing:.06em; color:var(--half); opacity:.16; transition:opacity .4s}
  #panel:hover,#panel:focus-within,#panel.wake{opacity:.95}
  #panel .g{display:flex; align-items:center; gap:.5rem}
  #panel .l{font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--hair)}
  #panel button{font:inherit; color:var(--half); background:none; border:none;
                cursor:pointer; padding:.25rem .4rem}
  #panel button:hover,#panel button.act{color:var(--ink)}
  #panel .s{width:1px; height:13px; background:var(--hair)}
  #meter{font-variant-numeric:tabular-nums}

  #head{position:fixed; top:1.9rem; left:2.2rem; z-index:4; font-family:var(--mono);
        font-size:.7rem; letter-spacing:.12em; color:var(--hair); max-width:34ch; line-height:1.9}
</style>

<canvas id="trace"></canvas>
<canvas id="words"></canvas>
<div id="line"></div>
<div id="head">пластина · слово как вещь в поле</div>

<div id="panel">
  <div class="g"><span class="l">слово</span>
    <button type="button" data-mode="0">субтитром</button>
    <button type="button" data-mode="1" class="act">в поле</button>
    <button type="button" data-mode="2">в поле · расход</button></div>
  <div class="s"></div>
  <div class="g"><button id="again" type="button">заново</button>
    <button id="jump" type="button">прыжок в финал</button></div>
  <div class="s"></div>
  <div class="g"><button id="snd" type="button">голос выкл</button></div>
  <div class="s"></div>
  <div class="g"><span id="meter">R 1.00 · 0.0 с</span></div>
</div>

<script>
(() => {
"use strict";

/* ─────────── ФРАГМЕНТ ПАРТИТУРЫ ───────────
   Медведь и Огонь: две встречи, где у говорящего разное место в поле.
   who — не «персонаж», а адрес: откуда сказано. Из него следует и позиция слова,
   и панорама голоса. Место, поведение и вид заданы замыслом, а не по умолчанию.  */

const SC = [
  {t:"Тень, большая, чем Круг.",     k:"mark",             h:1900, g:900},
  {t:"— Куда ты катишься?",          k:"say", v:"t09", w:"medv", h:1720, g:800},
  {t:"— Я не знаю.",                 k:"say", v:"t10", w:"krug", h:3440, g:1900},
  {t:"— Но я сильный.",              k:"say", v:"t13", w:"medv", h:1480, g:900},
  {t:"Тень рассыпается.",            k:"mark",             h:1600, g:1600},
  {t:"— Ты. Внутри.",                k:"say", v:"t20", w:"ogon", h:2600, g:2400},
  {t:"— Я всё ещё Круг?",            k:"say", v:"t21", w:"krug", h:2280, g:1300},
  {t:"— Ты был всего лишь формой.",  k:"say", v:"t22", w:"ogon", h:2560, g:900},
  {t:"— Нет.",                       k:"say", v:"t23", w:"krug", h:800,  g:1100},
  {t:"— Тогда кем ты был?",          k:"say", v:"t24", w:"ogon", h:2200, g:3000},
  {t:"Круг исчезает.",               k:"mark",             h:2000, g:3400},
];

/* ─────────── ПОЛЕ ─────────── */
const cv = document.getElementById("trace"), cx = cv.getContext("2d", {alpha:false});
const wv = document.getElementById("words"), wx = wv.getContext("2d");
const elLine = document.getElementById("line"), elPanel = document.getElementById("panel");
const elMeter = document.getElementById("meter");
let W=0,H=0,DPR=1,CXp=0,CYp=0,UNIT=0;

function paper(){ return "#e6e4df"; }
function size(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = wv.width = Math.floor(W*DPR); cv.height = wv.height = Math.floor(H*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0); wx.setTransform(DPR,0,0,DPR,0,0);
  CXp = W*0.5; CYp = H*0.46; UNIT = Math.min(W,H);
  cx.fillStyle = paper(); cx.fillRect(0,0,W,H);
  wx.clearRect(0,0,W,H);
}
size(); addEventListener("resize", () => { size(); start(); });

const DECAY  = 0.48;   /* след движения: полураспад 1,44 с — как у вещи */
const WDECAY = 0.055;  /* сказанное: полураспад ~12,6 с. Два времени в одной вещи. */
const nz = (x) => Math.sin(x)*0.5 + Math.sin(x*2.31+1.7)*0.3 + Math.sin(x*5.13+3.1)*0.2;

let mode = 1;                          /* 0 субтитр · 1 слово в поле · 2 + расход */
let T=0, th=0, R=1, idx=-1, clock=0, running=false, words=[], markRow=0;
const PEN = {w:2.15, ink:.62, amp:.19};

function penPoint(a){
  const r = PEN.amp*UNIT*(1 + 0.075*nz(a*3.0) + 0.042*nz(a*7.7+2.1) + 0.03*nz(a*1.31 + T*0.055));
  return [CXp + Math.cos(a)*r, CYp + Math.sin(a)*r*0.985];
}

/* ─────────── МЕСТО СЛОВА ───────────
   Круг говорит там, где сейчас перо: слово ложится на собственный след.
   Медведь — слева и ниже, тяжёлой строкой: он масса, у него нет орбиты.
   Огонь — кольцом вокруг Круга: он не в точке, он охватывает.
   Разметка — не в сцене вообще: она на полях листа, как пометка счетовода.        */

function placeWord(who, i, n, txt){
  const S = UNIT;
  if (who === "krug"){
    /* по касательной было эффектно и нечитаемо: слово встаёт горизонтально,
       но в той точке, где перо было, когда он это сказал — чуть внутрь от следа */
    const a = th + 0.10*i;
    const [x,y] = penPoint(a);
    return {x: CXp + (x-CXp)*0.78, y: CYp + (y-CYp)*0.78, rot: 0, size: S*0.028, font:"serif"};
  }
  if (who === "medv"){
    return {x: CXp - S*0.40 + i*S*0.052, y: CYp + S*0.16 + i*S*0.030,
            rot: 0.05, size: S*0.040, font:"serif"};
  }
  if (who === "ogon"){
    const a = -0.85 + i*0.62 + n*0.11;
    const r = S*0.30;
    return {x: CXp + Math.cos(a)*r*1.34, y: CYp + Math.sin(a)*r*1.16,
            rot: 0, size: S*0.026, font:"serif"};
  }
  markRow++;
  return {x: S*0.055, y: S*0.10 + (markRow%7)*S*0.034, rot:0, size:S*0.016,
          font:"mono", dim:true, align:"left"};
}

/* слово прожимается ограниченное число кадров, дальше его ест лист:
   у него есть свой срок нажима, как у пера — свой оборот */
function sayWords(b){
  if (mode === 0) return;
  const who = b.k === "mark" ? "mark" : (b.w || "krug");
  /* разметка не разбирается на слова: она не звучит, она записана — целой строкой на полях */
  if (who === "mark"){
    words.push({txt: b.t.replace(/\n/g," "), born:0, quota:22, ...placeWord("mark",0,1,b.t)});
    return;
  }
  let parts = b.t.replace(/\n/g," ").split(/\s+/).filter(Boolean);
  if (parts[0] === "—" && parts.length > 1) parts = [parts[0]+" "+parts[1], ...parts.slice(2)];
  const span = b.h * 0.78;
  parts.forEach((p,i) => {
    const pl = placeWord(who, i, parts.length, p);
    words.push({txt:p, born: span*i/Math.max(1,parts.length), quota:22, ...pl});
  });
}

function drawWords(dt){
  /* слой слов гаснет вычитанием непрозрачности, а не заливкой бумагой:
     иначе он затянул бы след белёсой плёнкой */
  wx.globalCompositeOperation = "destination-out";
  wx.fillStyle = `rgba(0,0,0,${(1 - Math.exp(-dt*WDECAY)).toFixed(5)})`;
  wx.fillRect(0,0,W,H);
  wx.globalCompositeOperation = "source-over";
  if (!words.length) return;
  for (const wd of words){
    if (wd.quota <= 0 || clock < wd.born) continue;
    wd.quota--;
    const a = (wd.dim ? 0.030 : 0.055) * (mode === 2 ? Math.max(0.06, R) : 1);
    wx.save();
    wx.translate(wd.x, wd.y);
    wx.rotate(wd.rot);
    wx.font = (wd.font === "mono" ? `300 ${wd.size}px "JetBrains Mono", monospace`
                                  : `400 ${wd.size}px "PT Serif", Georgia, serif`);
    wx.textAlign = wd.align || "center"; wx.textBaseline = "middle";
    wx.fillStyle = `rgba(25,23,20,${a.toFixed(4)})`;
    wx.fillText(wd.txt, 0, 0);
    wx.restore();
    if (mode === 2) R = Math.max(0, R - 0.0016*wd.txt.length/6);   /* письмо тратит чернила */
  }
}

/* ─────────── ХОД ─────────── */
let prev = null;
function paint(dt){
  cx.globalCompositeOperation = "source-over";
  cx.fillStyle = paper();
  cx.globalAlpha = 1 - Math.exp(-dt*DECAY);
  cx.fillRect(0,0,W,H);
  cx.globalAlpha = 1;

  cx.globalCompositeOperation = "multiply";
  cx.lineCap = "round";
  const SUB = Math.min(96, Math.max(8, Math.ceil(dt*700)));
  const dim = mode === 2 ? Math.max(0.05, R) : 1;
  for (let i=1;i<=SUB;i++){
    const a = th + PEN.w*dt*(i/SUB);
    const p = penPoint(a);
    if (prev){
      const al = PEN.ink * dim * (0.55 + 0.45*(0.5+0.5*nz(a*4.4+1.3))) * 0.78;
      cx.strokeStyle = `rgba(25,23,20,${al.toFixed(4)})`;
      cx.lineWidth = 1.05 + 0.85*(0.5+0.5*nz(a*2.6+4.2));
      cx.beginPath(); cx.moveTo(prev[0],prev[1]); cx.lineTo(p[0],p[1]); cx.stroke();
    }
    prev = p;
  }
  th += PEN.w*dt;
  cx.globalCompositeOperation = "source-over";
  drawWords(dt);
}

function enter(i){
  idx = i; clock = 0;
  const b = SC[i]; if (!b) return;
  if (mode === 0){ elLine.textContent = b.t; elLine.className = b.k; }
  sayWords(b);
  if (b.v) playTake(b.v, b.w || "krug");
}

function tick(dt){
  T += dt;
  const b = SC[idx];
  if (b){
    clock += dt*1000;
    if (clock >= b.h + b.g){
      if (idx+1 < SC.length){ clock -= b.h + b.g; enter(idx+1); }
      else running = false;
    }
    if (mode === 0){
      const fade = 380, now = SC[idx];
      let o = 0;
      if (clock < fade) o = clock/fade;
      else if (clock < now.h - fade) o = 1;
      else if (clock < now.h) o = Math.max(0,(now.h-clock)/fade);
      elLine.style.opacity = o.toFixed(3);
    }
  }
  if (mode === 2) R = Math.max(0, R - 0.020*PEN.ink*PEN.w*dt);      /* след тоже тратит */
  paint(dt);
  if (words.length > 220) words = words.slice(-160);
}

function start(){
  T=0; th=0; R=1; idx=-1; clock=0; words=[]; markRow=0; prev=null;
  cx.globalCompositeOperation="source-over"; cx.globalAlpha=1;
  cx.fillStyle = paper(); cx.fillRect(0,0,W,H);
  wx.setTransform(DPR,0,0,DPR,0,0); wx.clearRect(0,0,W,H);
  elLine.textContent=""; elLine.style.opacity=0;
  enter(0); running = true;
}

let last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts-last)/1000; last = ts;
  if (dt > 1.5) dt = 1.5;
  if (running) tick(dt);
  elMeter.textContent = `R ${R.toFixed(2)} · ${T.toFixed(1)} с · слов ${words.length}`;
}

/* ─────────── ГОЛОС КАК ВЕЩЬ В ПОЛЕ ───────────
   Панорама берётся из места, где стоит слово. Круг говорит с той точки, где перо;
   Медведь — слева; Огонь — из кольца, и потому гуляет от реплики к реплике.
   Динамика автора НЕ выравнивается по каждому дублю: множитель один на все,
   иначе его собственные тихие реплики становятся такими же громкими, как крик.  */

let AC=null, out=null, soundOn=false, MAN=null, BUF={}, LOUD=1;
const BEND = { krug:{rate:1, gain:1.00}, medv:{rate:0.80, gain:1.05, lp:1600},
               ogon:{rate:1, gain:0.72, beat:14} };

async function loadMan(){
  if (MAN) return MAN;
  try{ MAN = await (await fetch("golos/manifest.json")).json(); }catch(e){ MAN = {}; }
  const used = SC.filter(b=>b.v).map(b=>b.v);
  let peak = 0;
  used.forEach(id => { if (MAN[id]) peak = Math.max(peak, MAN[id].peak || 0.06); });
  LOUD = Math.min(30, 0.85/(peak || 0.06));
  SC.forEach(b => { if (b.v && MAN[b.v]) b.h = Math.round(MAN[b.v].dur/(BEND[b.w]||BEND.krug).rate*1000) + 260; });
  return MAN;
}
async function audioOn(){
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  if (!AC){ AC = new C(); out = AC.createGain(); out.gain.value = 1; out.connect(AC.destination); }
  if (AC.state === "suspended") await AC.resume();
  await loadMan();
  for (const b of SC){
    if (!b.v || BUF[b.v] || !MAN[b.v]) continue;
    try{
      const ab = await (await fetch(`golos/${b.v}.webm`)).arrayBuffer();
      BUF[b.v] = await AC.decodeAudioData(ab);
    }catch(e){ console.warn("голос", b.v, e); }
  }
}
function audioOff(){ if (AC && AC.state === "running") AC.suspend().catch(()=>{}); }

function playTake(id, who){
  if (!soundOn || !AC || AC.state !== "running" || !BUF[id] || !MAN[id]) return;
  const m = MAN[id], b = BEND[who] || BEND.krug, t = AC.currentTime;
  /* место голоса = место его слова: панораму берём из первого слова этой реплики */
  const wd = words.filter(x => x.quota > 0).slice(-1)[0];
  const pan = wd ? Math.max(-0.9, Math.min(0.9, (wd.x - W/2)/(W/2))) : 0;
  const mk = (detune) => {
    const src = AC.createBufferSource();
    src.buffer = BUF[id]; src.playbackRate.value = b.rate;
    if (detune) src.detune.value = detune;
    let node = src;
    if (b.lp){ const f = AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=b.lp;
               node.connect(f); node = f; }
    const g = AC.createGain();
    g.gain.value = b.gain * LOUD;          /* один множитель на все дубли: динамика автора цела */
    const p = AC.createStereoPanner(); p.pan.value = pan;
    node.connect(g); g.connect(p); p.connect(out);
    src.start(t, m.start, m.dur);
    src.stop(t + m.dur/b.rate + 0.05);
  };
  mk(0);
  if (b.beat) mk(b.beat);
}

/* ─────────── ПУЛЬТ ─────────── */
elPanel.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click", () => {
  mode = +btn.dataset.mode;
  elPanel.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("act", x===btn));
  elLine.textContent=""; elLine.style.opacity=0;
  start();
}));
document.getElementById("again").addEventListener("click", start);
/* приёмка памяти: в режиме «расход» прыжок даёт финал с полным R —
   картинка получается неправильная, и это доказывает, что величина помнит */
document.getElementById("jump").addEventListener("click", () => {
  start(); idx = SC.length-2; clock = 0; words = []; enter(SC.length-2);
});
document.getElementById("snd").addEventListener("click", async e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? "голос вкл" : "голос выкл";
  e.target.classList.toggle("act", soundOn);
  if (soundOn) await audioOn(); else audioOff();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) audioOff(); });
addEventListener("pagehide", audioOff);
let wake; addEventListener("mousemove", () => {
  elPanel.classList.add("wake"); clearTimeout(wake);
  wake = setTimeout(()=>elPanel.classList.remove("wake"), 2000);
});

/* прогон без ожидания кадров — чтобы вещь можно было проверить, а не только смотреть */
window.__run = (sec) => { const d = 1/40; for (let i=0;i<Math.round(sec*40);i++) tick(d);
  return {mode, R:+R.toFixed(3), t:+T.toFixed(1), line: SC[idx] && SC[idx].t, words: words.length}; };

document.fonts.ready.then(() => { loadMan().then(start); });
requestAnimationFrame(frame);
})();
</script>
